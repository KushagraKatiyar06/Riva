<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riva vs Competitor - Dual Eye Monitor</title>
    <style>
        body {
            background-color: #0a0f1d;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
        }

        .eye-monitor-row {
            display: flex;
            gap: 60px;
            margin-bottom: 50px;
        }

        .eye-container {
            width: 300px;
            text-align: center;
            cursor: pointer;
        }

        .label {
            margin-top: 15px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 14px;
        }

        #riva-label { color: #00ffff; text-shadow: 0 0 10px #00ffff55; }
        #comp-label { color: #ff3333; text-shadow: 0 0 10px #ff333355; }

        .pupil-group {
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .eyelid {
            transition: transform 0.15s ease-in-out;
            transform: translateY(-100%); 
        }

        /* Glow Effects */
        .glow-riva { filter: drop-shadow(0 0 8px #00ffff); transition: r 0.4s; }
        .glow-comp { filter: drop-shadow(0 0 8px #ff3333); transition: r 0.4s; }

        button {
            padding: 15px 30px;
            font-size: 14px;
            font-weight: bold;
            border: 2px solid #1a2a4a;
            border-radius: 4px;
            background: transparent;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
        }

        button.active {
            background: #fff;
            color: #0a0f1d;
            border-color: #fff;
            box-shadow: 0 0 20px rgba(255,255,255,0.4);
        }
    </style>
</head>
<body>

    <div class="eye-monitor-row">
        <div class="eye-container" id="riva-box">
            <svg viewBox="0 0 200 120">
                <defs>
                    <clipPath id="eye-clip"><path d="M10,60 Q100,-15 190,60 Q100,135 10,60" /></clipPath>
                </defs>
                <g clip-path="url(#eye-clip)">
                    <path d="M10,60 Q100,-15 190,60 Q100,135 10,60" fill="#e0f7fa" />
                    <g id="riva-pupil" class="pupil-group">
                        <circle cx="100" cy="60" r="28" fill="#002233" />
                        <circle id="riva-glow" class="glow-riva" cx="100" cy="60" r="10" fill="#00ffff" />
                    </g>
                    <rect id="riva-lid" class="eyelid" width="200" height="120" fill="#1a2a4a" />
                </g>
                <path d="M10,60 Q100,-15 190,60" fill="none" stroke="#00ffff" stroke-width="2" opacity="0.3"/>
            </svg>
            <div class="label" id="riva-label">Riva Agent</div>
        </div>

        <div class="eye-container" id="comp-box">
            <svg viewBox="0 0 200 120">
                <g clip-path="url(#eye-clip)">
                    <path d="M10,60 Q100,-15 190,60 Q100,135 10,60" fill="#fbe9e7" />
                    <g id="comp-pupil" class="pupil-group">
                        <circle cx="100" cy="60" r="28" fill="#330000" />
                        <circle id="comp-glow" class="glow-comp" cx="100" cy="60" r="10" fill="#ff3333" />
                    </g>
                    <rect id="comp-lid" class="eyelid" width="200" height="120" fill="#2a1a1a" />
                </g>
                <path d="M10,60 Q100,-15 190,60" fill="none" stroke="#ff3333" stroke-width="2" opacity="0.3"/>
            </svg>
            <div class="label" id="comp-label">Competitor</div>
        </div>
    </div>

    <button id="master-toggle">Initiate Analysis</button>

    <script>
        const elements = {
            rivaPupil: document.getElementById('riva-pupil'),
            compPupil: document.getElementById('comp-pupil'),
            rivaGlow: document.getElementById('riva-glow'),
            compGlow: document.getElementById('comp-glow'),
            rivaLid: document.getElementById('riva-lid'),
            compLid: document.getElementById('comp-lid'),
            btn: document.getElementById('master-toggle')
        };

        let active = false;

        function blink(lid) {
            lid.style.transform = "translateY(0%)";
            setTimeout(() => lid.style.transform = "translateY(-100%)", 150);
        }

        function sentientLoop(pupil, glow, lid) {
            if (!active) return;

            // Random Look
            const x = (Math.random() - 0.5) * 50;
            const y = (Math.random() - 0.5) * 30;
            pupil.style.transform = `translate(${x}px, ${y}px)`;

            // Random Dilation
            glow.setAttribute('r', Math.random() > 0.5 ? '14' : '9');

            // Random Blink chance
            if (Math.random() > 0.8) blink(lid);

            setTimeout(() => sentientLoop(pupil, glow, lid), Math.random() * 1500 + 500);
        }
        

        elements.btn.addEventListener('click', () => {
            active = !active;
            elements.btn.classList.toggle('active');
            elements.btn.innerText = active ? "Monitoring Active" : "Initiate Analysis";

            if (active) {
                sentientLoop(elements.rivaPupil, elements.rivaGlow, elements.rivaLid);
                // Slight delay for the second eye so they don't look mirrored
                setTimeout(() => sentientLoop(elements.compPupil, elements.compGlow, elements.compLid), 300);
            } else {
                elements.rivaPupil.style.transform = "translate(0,0)";
                elements.compPupil.style.transform = "translate(0,0)";
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (active) return;
            const x = (e.clientX / window.innerWidth - 0.5) * 40;
            const y = (e.clientY / window.innerHeight - 0.5) * 20;
            elements.rivaPupil.style.transform = `translate(${x}px, ${y}px)`;
            elements.compPupil.style.transform = `translate(${x}px, ${y}px)`;
        });
    </script>
</body>
</html>
