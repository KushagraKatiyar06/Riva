name = "riva-worker"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[browser]
binding = "BROWSER"

[[durable_objects.bindings]]
name = "RIVA_BRAIN"
class_name = "RivaBrainDO"

[[migrations]]
tag = "v10"
new_sqlite_classes = ["RivaBrainDO"]

[vars]
GEMINI_API_KEY = "REPLACE_ME"
